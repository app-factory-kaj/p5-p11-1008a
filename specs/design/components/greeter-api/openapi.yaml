openapi: 3.0.3
info:
  title: Greeter API
  version: 0.1.0
servers:
  - url: /
paths:
  /hello:
    get:
      operationId: getGreeting
      summary: Return a JSON greeting for the given name
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
          description: The name to greet
      responses:
        '200':
          description: The greeting for the given name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Greeting'
        '400':
          description: The name query parameter is missing or empty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Greeting:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: 'The formatted greeting, e.g. "Hello, Ada!"'
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Short, human-readable error message
